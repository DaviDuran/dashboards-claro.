<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulario de Campo</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f3f4f6; margin: 0; padding: 16px; color: #1f2937; }
    .container { max-width: 500px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.07); }
    h2 { margin-top: 0; font-size: 1.25rem; text-align: center; color: #111827; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: #374151; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.95rem; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #2563eb; ring: 2px #93c5fd; }
    input[readonly] { background-color: #f9fafb; color: #6b7280; }
    .photo-box { border: 2px dashed #cbd5e1; border-radius: 8px; padding: 12px; text-align: center; background: #f8fafc; }
    .photo-box input[type="file"] { display: none; }
    .btn-camera { display: inline-block; background: #0284c7; color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 500; }
    #preview { max-width: 100%; max-height: 200px; border-radius: 6px; margin-top: 10px; display: none; }
    .btn-submit { width: 100%; background: #16a34a; color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 12px; }
    .btn-submit:hover { background: #15803d; }
    .status { margin-top: 10px; font-size: 0.85rem; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <h2>Levantamiento en Campo</h2>

  <!-- Buscador de Base Precargada -->
  <div class="form-group">
    <label for="search">Buscar ID / Elemento / Dirección</label>
    <input list="database-list" id="search" placeholder="Escribe para buscar..." autocomplete="off">
    <datalist id="database-list"></datalist>
  </div>

  <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 16px 0;">

  <!-- Formulario -->
  <form id="fieldForm">
    <div class="form-group">
      <label>ID Registro</label>
      <input type="text" id="regId" readonly required>
    </div>

    <div class="form-group">
      <label>Nombre / Elemento</label>
      <input type="text" id="regName" readonly required>
    </div>

    <div class="form-group">
      <label>Ubicación / Detalle Base</label>
      <input type="text" id="regDetail" readonly>
    </div>

    <div class="form-group">
      <label for="status">Estado en Sitio</label>
      <select id="status" required>
        <option value="">Seleccione una opción...</option>
        <option value="Operativo">Operativo</option>
        <option value="Con Novedad">Con Novedad</option>
        <option value="No Encontrado">No Encontrado</option>
      </select>
    </div>

    <div class="form-group">
      <label for="comments">Observaciones de Campo</label>
      <textarea id="comments" rows="3" placeholder="Detalles encontrados en terreno..."></textarea>
    </div>

    <!-- Captura de Foto -->
    <div class="form-group">
      <label>Evidencia Fotográfica</label>
      <div class="photo-box">
        <label for="cameraInput" class="btn-camera">📸 Tomar Foto</label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment">
        <br>
        <img id="preview" alt="Vista previa">
      </div>
    </div>

    <button type="submit" class="btn-submit">Guardar Registro</button>
  </form>
  <div id="statusMsg" class="status"></div>
</div>

<script>
  // 1. BASE DE DATOS PRECARGADA (Reemplazar con export de tu Excel/JSON)
  const database = [
    { id: "NOD-001", name: "Nodo Central Plaza", detail: "Calle 100 # 15-20" },
    { id: "NOD-002", name: "Gabinete Norte", detail: "Av. Suba # 128-02" },
    { id: "NOD-003", name: "Antena Sectorial Sur", detail: "Cra 7 # 45-10" }
  ];

  let base64Photo = "";

  // 2. POBLAR EL DATALIST DEL BUSCADOR
  const datalist = document.getElementById("database-list");
  database.forEach(item => {
    const opt = document.createElement("option");
    opt.value = `${item.id} - ${item.name}`;
    datalist.appendChild(opt);
  });

  // 3. AUTOCOMPLETAR AL SELECCIONAR
  document.getElementById("search").addEventListener("input", (e) => {
    const val = e.target.value;
    const match = database.find(item => val.includes(item.id));
    if (match) {
      document.getElementById("regId").value = match.id;
      document.getElementById("regName").value = match.name;
      document.getElementById("regDetail").value = match.detail;
    }
  });

  // 4. CAPTURAR Y COMPRIMIR IMAGEN
  document.getElementById("cameraInput").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      const img = new Image();
      img.onload = function() {
        // Redimensionar a max 1024px para optimizar peso
        const canvas = document.createElement("canvas");
        const maxDim = 1024;
        let width = img.width;
        let height = img.height;

        if (width > height && width > maxDim) {
          height *= maxDim / width;
          width = maxDim;
        } else if (height > maxDim) {
          width *= maxDim / height;
          height = maxDim;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        // Calidad 0.7 en JPEG (~100-250 KB)
        base64Photo = canvas.toDataURL("image/jpeg", 0.7);

        const preview = document.getElementById("preview");
        preview.src = base64Photo;
        preview.style.display = "block";
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  });

  // 5. ENVÍO O EXPORTACIÓN DEL FORMULARIO
  document.getElementById("fieldForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const payload = {
      id: document.getElementById("regId").value,
      name: document.getElementById("regName").value,
      detail: document.getElementById("regDetail").value,
      status: document.getElementById("status").value,
      comments: document.getElementById("comments").value,
      photo: base64Photo,
      timestamp: new Date().toISOString()
    };

    // --- OPCIÓN A: Descargar archivo local (Modo Offline) ---
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `reporte_${payload.id}_${Date.now()}.json`;
    link.click();

    document.getElementById("statusMsg").innerText = "✔ Registro generado y descargado localmente.";
    
    // --- OPCIÓN B: Enviar a API / Google Apps Script ---
    /*
    fetch("URL_DE_TU_APPS_SCRIPT_O_API", {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => alert("Enviado con éxito a la base central"))
    .catch(err => alert("Error enviando: " + err));
    */
  });
</script>

</body>
</html>
